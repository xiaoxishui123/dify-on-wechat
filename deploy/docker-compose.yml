version: '3'
services:
  # Gewechat 微信协议服务 (iPad协议)
  gewechat:
    image: gewe
    container_name: gewe
    volumes:
      - ./gewechat/data:/root/temp
    ports:
      - "2531:2531"
      - "2532:2532"
    restart: always
    networks:
      - dow-network

  # Dify on WeChat 主服务
  dify-on-wechat:
    image: registry.cn-hangzhou.aliyuncs.com/hanfangyuan/dify-on-wechat:latest
    user: root
    container_name: dify-on-wechat
    restart: always
    pull_policy: always
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: 'Asia/Shanghai'
    ports:
      - "7860:7860"   # Web UI (可选开启)
      - "9919:9919"   # gewechat 回调端口
    volumes:
      - ./config.json:/app/config.json
      - ./plugins:/app/plugins
    depends_on:
      - gewechat
    networks:
      - dow-network

networks:
  dow-network:
    driver: bridge
