<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 24px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            margin: 0 0 16px 0;
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }
        p {
            margin: 0;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{text}}</h1>
        <p>{{explanation}}</p>
    </div>
</body>
</html>
